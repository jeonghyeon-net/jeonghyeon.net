name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!.github/**'
      - '.github/site-builder/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: .github/site-builder/go.mod
          cache-dependency-path: .github/site-builder/go.sum

      - name: Check for images requiring optimization
        id: image-optimization
        run: |
          if make --silent -C .github/site-builder has-optimizable-images; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install image optimization tools
        if: steps.image-optimization.outputs.required == 'true'
        run: sudo apt-get update && sudo apt-get install --yes webp imagemagick

      - name: Optimize and fix lint violations
        run: make -C .github/site-builder prepare

      - name: Commit automatic fixes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: apply automatic site fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build site
        run: make -C .github/site-builder build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jeonghyeon-net

      - name: Archive to Wayback Machine
        continue-on-error: true
        run: curl -s "https://web.archive.org/save/https://jeonghyeon.net/sitemap.xml" > /dev/null

      - name: Delete old deployments
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/jeonghyeon-net/deployments")
          echo "$RESPONSE" | jq 'del(.result[].source, .result[].env_vars)' || echo "$RESPONSE"
          OLD_IDS=$(echo "$RESPONSE" | jq -r '(.result // [])[1:][].id')
          for id in $OLD_IDS; do
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/jeonghyeon-net/deployments/$id?force=true" > /dev/null
          done
